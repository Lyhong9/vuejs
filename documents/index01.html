<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Vue App</title>
    <!-- Vue 3 Core CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Official Tailwind v4 Browser CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100 p-8">
    <!-- ONLY ONE app div here -->
    <div id="app" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
      <h1 class="text-2xl font-bold mb-4">
        {{ "Hello, " + message.length + " characters!" }}
      </h1>
      <p class="text-gray-700 mb-4">Count: {{ count }}</p>

      <div class="space-y-2">
        <button
          @click="incrementCount"
          class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition mr-2"
        >
          Increment Count
        </button>
        <button
          @click="resetCount"
          class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition"
        >
          Reset Count
        </button>
      </div>
      <button
        @click="toggleVisibility"
        class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded mt-2 block w-full transition"
      >
        Toggle Visibility
      </button>
      <p v-if="isVisible" class="mt-4 p-2 bg-green-100 text-green-800 rounded">
        This text is visible. {{count}}
      </p>

      <button
        @click="greet"
        class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded mt-4 block w-full transition"
      >
        Greet
      </button>
      <h1 class="text-xl font-semibold mt-2">{{ myname }}</h1>
      <input
        v-model="myname"
        placeholder="Enter your name"
        class="mt-2 p-2 border rounded w-full"
      />
      <button
        @click="updateName"
        class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded mt-2 block w-full transition"
      >
        Update Name
      </button>
      <input
        :value="message"
        @input="message = $event.target.value"
        placeholder="Type a message"
        class="mt-2 p-2 border rounded w-full"
      />

      <div class="mt-4 p-4 border rounded bg-gray-50">
        <label class="block mb-2">Choose a country:</label>
        <select v-model="country" class="p-2 border rounded w-full">
          <option value="">-- Select --</option>
          <option value="usa">United States</option>
          <option value="uk">United Kingdom</option>
          <option value="canada">Canada</option>
          <option value="australia">Australia</option>
        </select>
        <p class="mt-4">Selected: {{ country || 'None' }}</p>
      </div>

      <div class="mt-4 p-4 border rounded bg-gray-50">
        <label class="flex items-center space-x-2">
          <input type="checkbox" v-model="agreed" class="w-5 h-5" />
          <span>I agree to the terms and conditions</span>
        </label>

        <button
          :disabled="!agreed"
          :class="agreed ? 'bg-green-500' : 'bg-gray-300'"
          class="mt-4 px-6 py-2 text-white rounded-lg"
        >
          Submit
        </button>

        <p class="mt-2">Agreed: {{ agreed }}</p>
      </div>

      <div class="mt-4 p-4 border rounded bg-gray-50">
        <label class="flex items-center space-x-2">
          <input type="radio" v-model="size" value="small" />
          <span>Small</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="radio" v-model="size" value="medium" />
          <span>Medium</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="radio" v-model="size" value="large" />
          <span>Large</span>
        </label>
      </div>
    </div>

    <script>
      const { createApp } = Vue;
      const app = createApp({
        data() {
          return {
            message: "Hello Vue!",
            count: 0,
            isVisible: true,
            myname: "Lyhong",
            agreed: false,
            size: "medium",
            country: "usa",
          };
        },
        methods: {
          incrementCount() {
            this.count++;
          },
          toggleVisibility() {
            this.isVisible = !this.isVisible;
          },
          greet() {
            alert("Hello, " + this.message);
          },
          resetCount() {
            this.count = 0;
          },
          updateName() {
            this.myname = "LYHONG IS AWESOME";
          },
        },
      });
      app.mount("#app");
    </script>
  </body>
</html>
