<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Vue App</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100 p-8">
    <div id="app" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
      <!-- How to use Computed -->
      <template class="flex flex-col mt-4 gap-1">
        <input
          v-model.lazy="fullName"
          class="border border-gray-300 rounded p-2 w-[150px]"
          placeholder="type new name"
        />
        <!-- Typing "Jane Smith" will update firstName and lastName -->
        <p>{{ fullName }}</p>
        <!-- Computed once, then cached -->
        <p>{{ fullName }}</p>
        <!-- Retrieved from cache -->
        <p>{{ completedTodos[0].text }}</p>
        <!-- Computed once, then cached -->
        <p>{{ pendingTodos.length }}</p>
        <!-- Retrieved from cache -->
        <p>{{ completedCount }}</p>
        <!-- Computed once, then cached -->
        <p>{{ pendingCount }}</p>
        <!-- Retrieved from cache -->
      </template>
    </div>

    <script>
      const { createApp } = Vue;
      createApp({
        data() {
          return {
            firstName: "John",
            lastName: "Doe",
            todos: [
              { id: 1, text: "Learn Vue", done: true },
              { id: 2, text: "Build app", done: false },
              { id: 3, text: "Deploy", done: false },
            ],
          };
        },
        computed: {
          fullName: {
            get() {
              return `${this.firstName} ${this.lastName}`;
            },
            set(newValue) {
              const names = newValue.split(" ");
              this.firstName = names[0];
              this.lastName = names[names.length - 1];
            },
          },
          completedTodos() {
            return this.todos.filter((todo) => todo.done);
          },
          pendingTodos() {
            return this.todos.filter((todo) => !todo.done);
          },
          completedCount() {
            return this.completedTodos.length;
          },
          pendingCount() {
            return this.pendingTodos.length;
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
