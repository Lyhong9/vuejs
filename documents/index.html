<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Vue App</title>
    <!-- Vue 3 Core CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Official Tailwind v4 Browser CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100 p-8">
    <!-- ONLY ONE app div here -->
    <div id="app" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
      <h1 class="text-2xl font-bold mb-4">{{ "Hello, " + message.length + " characters!" }}</h1>
      <p class="text-gray-700 mb-4">Count: {{ count }}</p>
      
      <div class="space-y-2">
        <button @click="incrementCount" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition mr-2">Increment Count</button>
        <button @click="resetCount" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition">Reset Count</button>
      </div>
      <button @click="toggleVisibility" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded mt-2 block w-full transition">Toggle Visibility</button>
      <p v-if="isVisible" class="mt-4 p-2 bg-green-100 text-green-800 rounded">This text is visible. {{count}}</p>
      
      <button @click="greet" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded mt-4 block w-full transition">Greet</button>
      
    </div>

    <script>
      const { createApp } = Vue;
      const app = createApp({
        data() {
          return {
            message: "Hello Vue!",
            count: 0,
            isVisible: true,
          };
        },
        methods: {
          incrementCount() {
            this.count++;
          },
          toggleVisibility() {
            this.isVisible = !this.isVisible;
          },
          greet() {
            alert("Hello, " + this.message);
          },
          resetCount(){
            this.count = 0;
          }
        }
      });
      app.mount("#app");
    </script>
  </body>
</html>
