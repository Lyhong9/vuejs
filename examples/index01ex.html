<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div id="app" class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Contact Form</h1>
    
    <form @submit.prevent="handleSubmit" class="space-y-4">
      <div>
        <label class="block mb-1 text-gray-700 font-medium">Name:</label>
        <input v-model.trim="form.name" 
               type="text" 
               class="w-full p-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
               required
               placeholder="Enter your name"
               >
      </div>
      
      <div>
        <label class="block mb-1 text-gray-700 font-medium">Email:</label>
        <input v-model="form.email" 
               type="email" 
               class="w-full p-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
               required
               placeholder="Enter your email"
               >
      </div>
      
      <div>
        <label class="block mb-1 text-gray-700 font-medium">Age:</label>
        <input v-model.number="form.age" 
               type="number" 
               class="w-full p-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
               required
               placeholder="Enter your age"
               >
      </div>
      
      <div>
        <label class="block mb-1 text-gray-700 font-medium">Message:</label>
        <textarea v-model="form.message" 
                  rows="4"
                  class="w-full p-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                  required
                  placeholder="Enter your message"></textarea>
      </div>
      
      <div class="flex items-center space-x-2">
        <input type="checkbox" v-model="form.subscribe" class="w-4 h-4">
        <label class="text-gray-700">Subscribe to newsletter</label>
      </div>
      
      <button type="submit" 
              class="w-full py-3 bg-blue-500 text-white font-bold rounded-lg hover:bg-blue-600 transition-colors">
        Submit
      </button>
    </form>
    
    <div v-if="submitted" class="mt-6 p-4 bg-green-50 border-l-4 border-green-500 rounded">
      <h3 class="font-bold text-green-800 mb-2">Form Submitted!</h3>
      <pre class="text-sm text-gray-700">{{ JSON.stringify(form, null, 2) }}</pre>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          form: {
            name: '',
            email: '',
            age: null,
            message: '',
            subscribe: false
          },
          submitted: false
        }
      },
      methods: {
        handleSubmit() {
          this.submitted = true;
          console.log('Form data:', this.form);
          // You can send data to server here
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
