<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .task {
      padding: 1rem;
      margin: 0.5rem 0;
      border: 1px solid #ddd;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task.completed {
      background: #e8f5e9;
      text-decoration: line-through;
    }
    button {
      padding: 0.5rem 1rem;
      margin: 0.2rem;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }
    .btn-delete {
      background: #f44336;
      color: white;
    }
    .btn-complete {
      background: #4CAF50;
      color: white;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>📝 Task Manager</h1>
    
    <div>
      <input 
        v-model="newTask" 
        @keyup.enter="addTask"
        placeholder="Enter a new task">
      <button @click="addTask">Add Task</button>
    </div>
    
    <div v-if="tasks.length === 0">
      <p>No tasks yet. Add one above!</p>
    </div>
    
    <div v-else>
      <p>Total: {{ tasks.length }} | Completed: {{ completedCount }}</p>
      
      <div 
        v-for="task in tasks" 
        :key="task.id"
        :class="['task', { completed: task.completed }]">
        <span>{{ task.text }}</span>
        <div>
          <button 
            class="btn-complete" 
            @click="toggleTask(task.id)">
            {{ task.completed ? 'Undo' : 'Complete' }}
          </button>
          <button 
            class="btn-delete" 
            @click="deleteTask(task.id)">
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          newTask: '',
          tasks: [],
          nextId: 1
        }
      },
      computed: {
        completedCount() {
          return this.tasks.filter(task => task.completed).length;
        }
      },
      methods: {
        addTask() {
          if (this.newTask.trim()) {
            this.tasks.push({
              id: this.nextId++,
              text: this.newTask,
              completed: false
            });
            this.newTask = '';
          }
        },
        toggleTask(id) {
          const task = this.tasks.find(t => t.id === id);
          if (task) {
            task.completed = !task.completed;
          }
        },
        deleteTask(id) {
          this.tasks = this.tasks.filter(t => t.id !== id);
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
