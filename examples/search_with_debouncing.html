<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      id="app"
      class="min-h-screen bg-gray-100 flex items-center justify-center p-6"
    >
      <div class="w-full max-w-2xl">
        <div class="bg-white rounded-3xl shadow-xl p-8">
          <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
            🔍 Search Engine
          </h1>

          <div class="relative">
            <input
              v-model="searchQuery"
              type="text"
              placeholder="Search anything..."
              class="w-full border-2 border-gray-300 rounded-full px-6 py-4 text-lg focus:outline-none focus:border-blue-500 transition duration-300"
            />

            <span class="absolute right-6 top-4 text-2xl"> 🔍 </span>
          </div>

          <!-- Loading -->

          <div
            v-if="isSearching"
            class="flex items-center justify-center gap-3 mt-6 text-blue-500"
          >
            <div
              class="w-6 h-6 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"
            ></div>

            <span class="font-medium"> Searching... </span>
          </div>

          <!-- Results -->

          <div v-if="searchResults.length" class="mt-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Results</h2>

            <div
              v-for="result in searchResults"
              :key="result"
              class="bg-gray-50 hover:bg-blue-50 transition rounded-xl p-5 shadow mb-3 cursor-pointer"
            >
              <div class="flex items-center gap-3">
                <div
                  class="bg-blue-500 text-white w-10 h-10 rounded-full flex items-center justify-center"
                >
                  📄
                </div>

                <div>
                  <h3 class="font-semibold">{{ result }}</h3>

                  <p class="text-gray-500 text-sm">
                    Click to view more details
                  </p>
                </div>
              </div>
            </div>
          </div>

          <!-- Empty -->

          <div
            v-if="!searchResults.length && !isSearching && searchQuery"
            class="text-center mt-8 text-gray-500"
          >
            No results found.
          </div>
        </div>
      </div>
    </div>
    <script>
      const app = Vue.createApp({
        data() {
          return {
            searchQuery: "",
            searchResults: [],
            isSearching: false,
            debounceTimer: null,
          };
        },

        watch: {
          searchQuery(newQuery) {
            this.isSearching = true;

            clearTimeout(this.debounceTimer);

            this.debounceTimer = setTimeout(() => {
              this.performSearch(newQuery);
            }, 500);
          },
        },

        methods: {
          performSearch(query) {
            if (!query.trim()) {
              this.searchResults = [];
              this.isSearching = false;
              return;
            }

            setTimeout(() => {
              this.searchResults = [
                `Result for "${query}"`,
                `${query} Tutorial`,
                `${query} Documentation`,
                `${query} Example`,
              ];

              this.isSearching = false;
            }, 1000);
          },
        },
      });

      app.mount("#app");
    </script>
  </body>
</html>
